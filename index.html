<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />

  <title>𝕏 應援刷推神器 - 賀鑫隆</title>
  <style>
    :root {
      --primary: #0f1419;
      --accent: #1d9bf0;
      --bg: #f7f9f9;
      --card-bg: #ffffff;
      --border: #eff3f4;
      --text: #0f1419;
      --text-sub: #536471;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      max-width: 520px;
      width: 100%;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      height: fit-content;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .lang-tabs {
      display: flex;
      background: #eff3f4;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .lang-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid #cfd9de;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: 600;
      outline: none;
    }

    .tag-input:focus {
      border-color: var(--accent);
    }

    .textarea-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #cfd9de;
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      color: var(--text);
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .char-count {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      padding: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-random {
      background: #eff3f4;
      color: var(--text);
    }

    .btn-copy {
      background: #eff3f4;
      color: var(--text);
    }

    .btn-tweet {
      width: 100%;
      background: #000000;
      color: #ffffff;
      padding: 14px;
      font-size: 15px;
      margin-top: 4px;
    }

    .btn-tweet:hover {
      background: #272c30;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 100;
    }

</head>

<div class="toast" id="toast">已複製到剪貼簿！</div>

<div class="container">
  <div class="header">
    <h1>𝕏 應援刷推神器</h1>
    <p>隨機生成多語言文案・一鍵跳轉發文</p>
  </div>

  <div class="lang-tabs">
    <button class="lang-btn active" onclick="setLanguage('all', this)">全部隨機</button>
    <button class="lang-btn" onclick="setLanguage('ko', this)">🇰🇷 韓文</button>
    <button class="lang-btn" onclick="setLanguage('ja', this)">🇯🇵 日文</button>
    <button class="lang-btn" onclick="setLanguage('en', this)">🇺🇸 英文</button>
  </div>

  <div class="section-label">Hashtags（以空格分隔）</div>
  <input type="text" id="hashtagInput" class="tag-input" value="#씬롱아_인기상_축하해 #XinlongBestPopularity" />

  <div class="section-label">推文預覽 / 編輯</div>
  <div class="textarea-wrapper">
    <textarea id="tweetContent" placeholder="點擊隨機生成文案..."></textarea>
    <span class="char-count" id="charCount">0 字</span>
  </div>

  <div class="btn-grid">
    <button class="btn-random" onclick="generateNewPost()">🎲 換一句</button>
    <button class="btn-copy" onclick="copyTweet()">📋 複製文案</button>
  </div>
  
  <button class="btn-tweet" onclick="jumpToX()">
    <span>前往 𝕏 發文</span>
    <span>↗</span>
  </button>
</div>

  let currentLang = 'all';
  const tweetTextarea = document.getElementById('tweetContent');
  const hashtagInput = document.getElementById('hashtagInput');
  const charCount = document.getElementById('charCount');

  function setLanguage(lang, btnElement) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    generateNewPost();
  }

  function getRandomPhrase() {
    let pool = [];
    if (currentLang === 'all') {
      pool = [...phrases.ko, ...phrases.ja, ...phrases.en];
    } else {
      pool = phrases[currentLang] || [];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function generateNewPost() {
    const text = getRandomPhrase();
    const tags = hashtagInput.value.trim();
    tweetTextarea.value = tags ? `${text}\n\n${tags}` : text;
    updateCharCount();
  }

  function updateCharCount() {
    charCount.textContent = `${tweetTextarea.value.length} 字`;
  }
  tweetTextarea.addEventListener('input', updateCharCount);

  function jumpToX() {
    const content = tweetTextarea.value.trim();
    if (!content) {
      alert("請先生成或輸入推文內容！");
      return;
    }
    const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(content)}`;
    window.open(tweetUrl, '_blank');
  }

  function copyTweet() {
    if (!tweetTextarea.value.trim()) return;
    navigator.clipboard.writeText(tweetTextarea.value).then(() => {
      showToast("已複製到剪貼簿！");
    }).catch(() => {
      tweetTextarea.select();
      document.execCommand('copy');
      showToast("已複製到剪貼簿！");
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 1800);
  }

  generateNewPost();
</script>
